

<h1>Pesquisa de Publicações</h1>
<div class="search-container">
   <mat-form-field appearance="fill" class="search-field mat-elevation-z1">
       <mat-label>Pesquisa</mat-label>
       <input matInput type="search" 
            appearance="standard" 
            placeholder="Digite sua pesquisa" 
            maxlength="100"
            [formControl]="queryField">
       <button (click)="findAllByTexto()" matSuffix mat-icon-button aria-label="Pesquisa">
            <mat-icon>search</mat-icon>
       </button>
   </mat-form-field>   
</div>

<div class="container">
   <div *ngIf="isShowSpinner" class="loading-spinner">
      <mat-spinner [diameter]="60" color="warn"></mat-spinner>
   </div>

   <div *ngIf="isShowTable">     
 
      <div class="mat-elevation-z8">
         <mat-form-field appearance="outline" mat-elevation-z4>
            <mat-label>Filtro</mat-label>
            <input matInput maxlength="50" (keyup)="applyFilter($event)" placeholder="Ex. processo">
         </mat-form-field>
 
       <table mat-table [dataSource]="dataSource">
         
         <ng-container matColumnDef="processo">
            <th mat-header-cell *matHeaderCellDef> Processo </th>
            <td mat-cell *matCellDef="let element"> {{element.processo}} </td>
         </ng-container>
 
          <ng-container matColumnDef="termos">
             <th mat-header-cell *matHeaderCellDef> Termos </th>
             <td mat-cell *matCellDef="let element"> {{element.termos}} </td>
          </ng-container>
 
          <ng-container matColumnDef="justica">
             <th mat-header-cell *matHeaderCellDef> Justiça </th>
             <td mat-cell *matCellDef="let element"> {{element.justica}} </td>
          </ng-container>
 
          <ng-container matColumnDef="estado">
             <th mat-header-cell *matHeaderCellDef> Estado </th>
             <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
          </ng-container>
 
          <ng-container matColumnDef="diario">
             <th mat-header-cell *matHeaderCellDef> Diário </th>
             <td mat-cell *matCellDef="let element"> {{element.diario}} </td>
          </ng-container>          
 
          <ng-container matColumnDef="dataDiario">
            <th mat-header-cell *matHeaderCellDef> Data do Diário </th>
            <td mat-cell *matCellDef="let element"> {{element.dataDiario}} </td>
          </ng-container>

          <ng-container matColumnDef="texto">
             <th mat-header-cell *matHeaderCellDef> Texto </th>           
             <td mat-cell *matCellDef="let element" class="coluna-texto">
               {{ element.texto }}
             </td>
          </ng-container>
 
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef> Ações </th>
            <td mat-cell *matCellDef="let element">               
              <!--  <a (click)="onRead(element)" routerLink="read/{{ element.id }}" >
                  <i class="material-icons read">visibility</i>
               </a> -->
               <a (click)="onRead(element)">
                  <i class="material-icons read">visibility</i>
               </a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>          
          <tr mat-row *matRowDef="let row; columns: columnsToDisplay;" 
            [class.selected]="row.id === selectedRowId">
          </tr>
      </table>
 
      <mat-paginator
         [pageSizeOptions]="[5, 10, 15]"
         showFirstLastButtons
         [pageIndex]="pageIndex"
         [pageSize]="pageSize"
         [length]="totalElements"
         (page)="findAllByTexto($event)">
      </mat-paginator>   
    </div>
   </div>
     
</div>
